name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Юнит-тесты (быстрые, без Docker)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установка JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Юнит-тесты
        run: ./gradlew test

  # ---------------------------------------------------------------------------
  # 2. Интеграционные тесты (Testcontainers: PostgreSQL + Redis в эфемерных контейнерах)
  #    Запускаются ПАРАЛЛЕЛЬНО (integrationForks=4). Требуют Docker.
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Установка JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Интеграционные тесты (параллельно)
        run: ./gradlew integrationTest -PintegrationForks=4

      - name: Публикация отчёта интеграционных тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest/

  # ---------------------------------------------------------------------------
  # 3. Сборка и публикация образа — только после успешных юнит- и интеграционных тестов
  # ---------------------------------------------------------------------------
  docker:
    needs: [test, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v4

      - name: Определение короткого SHA и имени образа
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # реестр требует имя целиком в нижнем регистре, а в имени репозитория есть заглавные
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Сборка образа (без публикации) с кэшированием слоёв
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # закреплено по SHA коммита: тег можно переписать, SHA — нет
      - name: Установка Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: Полный отчёт Trivy
        run: trivy image --format table --output trivy-report.txt "$IMAGE:$SHORT_SHA"

      - name: Генерация SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE:$SHORT_SHA"

      - name: Quality Gate — CRITICAL/HIGH с доступным исправлением
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:$SHORT_SHA"

      - name: Сохранение отчёта Trivy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Сохранение SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Вход в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:build-${{ github.run_number }}"

  # ---------------------------------------------------------------------------
  # 4. Промоушен проверенного образа в staging БЕЗ повторной сборки.
  #    buildx imagetools копирует манифест в реестре (не тянет и не пересобирает).
  # ---------------------------------------------------------------------------
  promote-staging:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Определение имени образа
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Вход в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Промоушен в staging (копия манифеста, без rebuild)
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:staging" \
            "$IMAGE:$SHORT_SHA"
          docker buildx imagetools inspect "$IMAGE:staging"

  # ---------------------------------------------------------------------------
  # 5. GitOps: автоматическое обновление Kubernetes-манифеста в Git.
  #    После промоушена в staging в ветку gitops коммитится новый тег образа.
  #    Внешний контроллер (Argo CD / Flux) смониторит эту ветку и применяет состояние.
  # ---------------------------------------------------------------------------
  update-gitops:
    needs: promote-staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Определение образа и неизменяемого тега деплоя
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Манифест пиннится на конкретную неизменяемую версию, а не на движущийся :staging,
          # иначе sed ничего не меняет и GitOps-коммита не происходит.
          echo "DEPLOY_TAG=build-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Подготовка ветки gitops (создаётся из master при первом запуске)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin gitops >/dev/null 2>&1; then
            git checkout -B gitops origin/gitops
          else
            git checkout -b gitops
          fi

      - name: Обновление тега образа в манифесте
        run: |
          sed -i "s|image: ghcr.io/[^:]*:.*|image: ${IMAGE}:${DEPLOY_TAG}|" k8s/crm-deployment.yaml
          grep -n "image:" k8s/crm-deployment.yaml

      - name: Коммит и пуш в ветку gitops
        run: |
          git add k8s/crm-deployment.yaml
          if git diff --cached --quiet; then
            echo "Манифест уже актуален — изменений нет"
          else
            git commit -m "chore(gitops): deploy ${DEPLOY_TAG} (${SHORT_SHA})"
            git push origin gitops
          fi